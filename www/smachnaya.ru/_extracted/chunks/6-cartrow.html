<div data-id="[+id+]" data-commerce-row="[+row+]" class="item_card">
						<div class="td-image">
							<a href="[+url+]" class="image">
								<img src="[+tv.image+]" class="img-fluid" alt="[+e.title+]" >
							</a>
						</div>
						<div class="td-info">
							<div class="item">
								<!--<div class="text">Рабочий стол</div>-->
								<div class="title">
									<a href="[+url+]">[+name+]</a>
								</div>
								<ul class="params">
								    <li>
										<div class="params-label">Доставка на [+options.material+]</div>
										
									</li>
									
									
								</ul>
								<!--<div class="link">
									<a href="[+url+]">Редактировать</a>
								</div>-->
							</div>
						</div>
						<div class="td-price sab">
							<div class="action">
								<div class="price">
									[[PriceFormat? &price=`[+tv.price+]`  &convert=`1`]]
								</div>
								
							</div>
						</div>
						<div class="td-counter">
							<div class="counter" data-toggle="counter">
								<input type="text" name="count" class="counter-input" value="[+count+]" data-commerce-action="recount" data-counter-input  />
								<div class="counter-btn counter-btn-prev" data-commerce-action="decrease" >&minus;</div>
								<div class="counter-btn counter-btn-next" data-commerce-action="increase" >&plus;</div>
							</div>
						</div>
						<div class="td-price">
							<div class="action">
								<div class="price">
									[[PriceFormat? &price=`[+total+]`  &convert=`1`]]
									
								</div>
								
							</div>
						</div>
